name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env desde el ejemplo
        run: cp .env.example .env

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar servicios
        run: docker compose up -d --wait

      - name: Prueba de ida y vuelta
        run: |
          curl -fsS -X POST localhost:5000/notas \
            -H "Content-Type: application/json" -d '{"texto":"prueba CI"}'
          curl -fsS localhost:5000/notas | grep "prueba CI"

      - name: Logs si falla
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v